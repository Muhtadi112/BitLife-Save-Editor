name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, alpha-0.2-development ]
    paths:
      - 'BitLifeSaveEditor/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BitLifeSaveEditor
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitLifeSaveEditor-alpha-0.2-debug-apk
          path: BitLifeSaveEditor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
