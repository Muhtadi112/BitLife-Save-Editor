name: Build BitLife Save Editor Alpha 0.9.5

on:
  push:
    branches:
      - alpha-0.3-development
      - alpha-0.4-development
    paths:
      - 'BitLifeSaveEditor/**'
      - '.github/workflows/build-alpha.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BitLifeSaveEditor
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests (synthetic fixtures; no personal save files)
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BitLifeSaveEditor-alpha-0.9.5-junit-reports
          path: BitLifeSaveEditor/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BitLifeSaveEditor-alpha-0.9.5-debug-apk
          path: BitLifeSaveEditor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
