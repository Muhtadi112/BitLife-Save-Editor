name: Build BitLife Save Editor Alpha 0.2

on:
  push:
    branches:
      - alpha-0.2-development
    paths:
      - 'BitLifeSaveEditor/**'
      - '.github/workflows/build-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BitLifeSaveEditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BitLifeSaveEditor-alpha-0.2-debug-apk
          path: BitLifeSaveEditor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
