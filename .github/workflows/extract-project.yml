name: Extract Android project archive
on:
  push:
    branches:
      - alpha-0.2-development
    paths:
      - .github/workflows/extract-project.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-0.2-development
          persist-credentials: true
      - name: Extract project ZIP
        run: |
          unzip -o BitLifeSaveEditor_GitHub_Build-1.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BitLifeSaveEditor
          git commit -m "Extract Android project source for Alpha 0.2" || exit 0
          git push
