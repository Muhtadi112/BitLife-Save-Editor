name: Analyze BitLife Save

on:
  workflow_dispatch:
  push:
    branches: [alpha-0.2-development]
    paths: [.github/workflows/analyze-save.yml]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: alpha-0.2-development
          fetch-depth: 0
      - name: Compare targeted finance structures
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:savedLife.data > /tmp/new.data
          git show origin/main^:savedLife.data > /tmp/old.data
          python3 - <<'PY'
          import struct, hashlib
          from pathlib import Path
          old=Path('/tmp/old.data').read_bytes()
          new=Path('/tmp/new.data').read_bytes()
          out=[]
          for label,data in [('OLD',old),('NEW',new)]:
            out += [f'{label}: size={len(data)} sha256={hashlib.sha256(data).hexdigest()}']
            for marker in [b'BankBalance',b'<BankBalance>k__BackingField',b'SimFinances',b'SimBankLoan',b'Loan']:
              ps=[]; s=0
              while True:
                p=data.find(marker,s)
                if p<0: break
                ps.append(p); s=p+1
              out.append(f'  {marker.decode()}: '+', '.join(f'0x{x:X}' for x in ps[:30])+f' (count={len(ps)})')
              if marker in [b'BankBalance',b'<BankBalance>k__BackingField',b'SimBankLoan']:
                for p in ps[:8]:
                  lo=max(0,p-96); hi=min(len(data),p+len(marker)+320)
                  out.append(f'    CONTEXT 0x{lo:X}-0x{hi:X}')
                  out.append('    HEX '+data[lo:hi].hex(' ').upper())
                  out.append('    ASCII '+data[lo:hi].decode('latin1',errors='replace'))
            out.append('')
          out += ['VALUE SEARCHES']
          for value in [853245,1000000000,999146755]:
            out.append(f'Value {value}:')
            for typ,fmt in [('i32','<i'),('i64','<q'),('f32','<f'),('f64','<d')]:
              try: raw=struct.pack(fmt,value)
              except (OverflowError,struct.error): continue
              for label,data in [('OLD',old),('NEW',new)]:
                poss=[]; s=0
                while True:
                  p=data.find(raw,s)
                  if p<0: break
                  poss.append(p); s=p+1
                if poss: out.append(f'  {label} {typ} {raw.hex(" ").upper()} @ '+', '.join(f'0x{x:X}' for x in poss[:30]))
            raw=str(value).encode()
            for label,data in [('OLD',old),('NEW',new)]:
              poss=[]; s=0
              while True:
                p=data.find(raw,s)
                if p<0: break
                poss.append(p); s=p+1
              if poss: out.append(f'  {label} ASCII @ '+', '.join(f'0x{x:X}' for x in poss[:30]))
          out += ['', 'No bytes modified. Numeric matches are candidates, not proof of BankBalance ownership.']
          Path('bitlife-finance-compare.txt').write_text('\\n'.join(out),encoding='utf-8')
          print('\\n'.join(out[:80]))
          PY
      - name: Upload targeted finance report
        uses: actions/upload-artifact@v4
        with:
          name: bitlife-finance-compare
          path: bitlife-finance-compare.txt
          retention-days: 7
