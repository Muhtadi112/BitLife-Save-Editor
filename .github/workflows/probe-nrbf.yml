name: Probe BitLife NRBF Finance Fields

on:
  workflow_dispatch:
  push:
    branches: [alpha-0.2-development, alpha-0.3-development]
    paths:
      - 'tools/NrbfProbe/**'
      - '.github/workflows/probe-nrbf.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the two latest commits that changed the real save
        shell: bash
        run: |
          git fetch origin main --prune
          mapfile -t save_commits < <(git log origin/main --format='%H' -- savedLife.data | head -n 2)
          if [ "${#save_commits[@]}" -ne 2 ]; then
            echo "Expected at least two commits that changed savedLife.data; found ${#save_commits[@]}."
            exit 1
          fi
          new_commit="${save_commits[0]}"
          old_commit="${save_commits[1]}"
          echo "Older save commit: ${old_commit}"
          echo "Newer save commit: ${new_commit}"
          git show "${old_commit}:savedLife.data" > /tmp/old.data
          git show "${new_commit}:savedLife.data" > /tmp/new.data
          sha256sum /tmp/old.data /tmp/new.data
          if cmp -s /tmp/old.data /tmp/new.data; then
            echo "The two selected save revisions are identical; refusing to run a meaningless probe."
            exit 1
          fi

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Decode NRBF without BinaryFormatter
        run: |
          dotnet run --project tools/NrbfProbe/NrbfProbe.csproj -- /tmp/old.data /tmp/new.data | tee nrbf-finance-probe.txt

      - name: Upload structural report
        uses: actions/upload-artifact@v4
        with:
          name: bitlife-nrbf-finance-probe
          path: nrbf-finance-probe.txt
          retention-days: 7
